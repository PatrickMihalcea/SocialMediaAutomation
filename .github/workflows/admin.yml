# One-off administrative tasks, started by hand.
#
# The live connection string is a repository secret and this is the only place
# it exists in a usable form — Vercel marks it Sensitive, so it can be written
# there and never read back. Rather than copy a production credential onto
# someone's laptop, the task runs where the credential already is.
#
# Nothing here is scheduled. Every run is a deliberate click.
name: Admin task

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        required: true
        type: choice
        options:
          - schedule-report
          - inspect-workflow
          - create-story-workflow
          - model-report
          - run-report
          - facebook-videos
          - repost-facebook-reels
          - repost-now
          - repost-status
          - cancel-reposts
          - accounts-report
      name:
        description: 'Existing workflow to read'
        required: false
        default: 'dark fantasy'
      newName:
        description: 'Name for the workflow being created'
        required: false
        default: 'Dark Fantasy Dreams — story'
      # repost-facebook-reels only. Plan prints what would be booked and writes
      # nothing; it takes choosing schedule, by hand, to put anything on a Page.
      mode:
        description: 'repost-facebook-reels: plan (read only) or schedule (books the Reels)'
        required: false
        type: choice
        default: plan
        options:
          - plan
          - schedule
      perDay:
        description: 'repost-facebook-reels: Reels per Page per day'
        required: false
        default: '5'
      count:
        description: 'repost-now: how many booked Reels to move to now (Page goes in name)'
        required: false
        default: '5'
      intervalMin:
        description: 'repost-facebook-reels: minutes between Reels, round the clock (0 = day slots)'
        required: false
        default: '0'

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Generate the database client
        working-directory: web
        run: npx prisma generate

      - name: Run the task
        working-directory: web
        run: node scripts/admin-task.mjs
        env:
          ADMIN_TASK: ${{ inputs.task }}
          WORKFLOW_NAME: ${{ inputs.name }}
          NEW_WORKFLOW_NAME: ${{ inputs.newName }}
          REPOST_MODE: ${{ inputs.mode }}
          REPOST_PER_DAY: ${{ inputs.perDay }}
          REPOST_COUNT: ${{ inputs.count }}
          REPOST_INTERVAL_MIN: ${{ inputs.intervalMin }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
